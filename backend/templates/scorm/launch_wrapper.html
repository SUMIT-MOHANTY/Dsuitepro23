<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORM Content - {{ content_title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .scorm-header {
            background: #16213e;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        
        .scorm-header h1 {
            font-size: 16px;
            font-weight: 500;
        }
        
        .scorm-header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e94560;
        }
        
        .status-indicator.connected {
            background: #00d9ff;
            box-shadow: 0 0 8px #00d9ff;
        }
        
        .scorm-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        #scorm-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #0f3460;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            color: #e94560;
            text-align: center;
            padding: 20px;
        }
        
        .debug-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 12px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        
        .debug-panel.visible {
            display: block;
        }
        
        .debug-panel h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #e94560;
        }
        
        .debug-entry {
            margin-bottom: 8px;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        
        .debug-entry .timestamp {
            color: #888;
            font-size: 10px;
        }
        
        .debug-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f3460;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .debug-toggle:hover {
            background: #e94560;
        }
    </style>
</head>
<body>
    <div class="scorm-header">
        <h1>{{ content_title }}</h1>
        <div class="status">
            <span id="connection-status">Initializing...</span>
            <div class="status-indicator" id="status-indicator"></div>
        </div>
    </div>
    
    <div class="scorm-container">
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <p>Loading SCORM content...</p>
        </div>
        
        <iframe 
            id="scorm-frame" 
            src="{{ content_url }}"
            allow="fullscreen"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        ></iframe>
    </div>
    
    <button class="debug-toggle" onclick="toggleDebug()">Debug</button>
    
    <div class="debug-panel" id="debug-panel">
        <h3>SCORM Debug Log</h3>
        <div id="debug-log"></div>
    </div>

    <script>
        // SCORM 1.2 API Configuration
        const SCORM_CONFIG = {
            apiVersion: '1.2',
            sessionId: '{{ session_id }}',
            registrationId: '{{ registration_id }}',
            apiBaseUrl: '{{ api_base_url }}',
            debug: {{ debug_mode|yesno:"true,false" }}
        };

        // SCORM API State
        let apiState = {
            initialized: false,
            lastError: '0',
            dataCache: {},
            commitQueue: []
        };

        // Debug logging
        function logDebug(message, data = null) {
            if (!SCORM_CONFIG.debug) return;
            
            const timestamp = new Date().toLocaleTimeString();
            const logContainer = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.className = 'debug-entry';
            entry.innerHTML = `
                <div class="timestamp">${timestamp}</div>
                <div>${message}</div>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            logContainer.insertBefore(entry, logContainer.firstChild);
        }

        function toggleDebug() {
            document.getElementById('debug-panel').classList.toggle('visible');
        }

        // Update connection status
        function updateStatus(status, connected = false) {
            document.getElementById('connection-status').textContent = status;
            const indicator = document.getElementById('status-indicator');
            if (connected) {
                indicator.classList.add('connected');
            } else {
                indicator.classList.remove('connected');
            }
        }

        // Hide loading overlay
        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        // Show error
        function showError(message) {
            const overlay = document.getElementById('loading-overlay');
            overlay.innerHTML = `<div class="error-message">${message}</div>`;
        }

        // SCORM 1.2 API Implementation
        const SCORM_API = {
            // Initialize the API
            LMSInitialize: async function(parameter) {
                logDebug('LMSInitialize called', { parameter });
                
                try {
                    const response = await fetch(`${SCORM_CONFIG.apiBaseUrl}/runtime/init/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-SCORM-Session': SCORM_CONFIG.sessionId,
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ parameter })
                    });
                    
                    const result = await response.json();
                    apiState.initialized = result.result === 'true';
                    apiState.lastError = result.errorCode;
                    
                    if (apiState.initialized) {
                        updateStatus('Connected', true);
                        hideLoading();
                    }
                    
                    logDebug('LMSInitialize result', result);
                    return result.result;
                } catch (error) {
                    logDebug('LMSInitialize error', error);
                    apiState.lastError = '101';
                    return 'false';
                }
            },

            // Finish the session
            LMSFinish: async function(parameter) {
                logDebug('LMSFinish called', { parameter });
                
                try {
                    const response = await fetch(`${SCORM_CONFIG.apiBaseUrl}/runtime/finish/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-SCORM-Session': SCORM_CONFIG.sessionId,
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ parameter })
                    });
                    
                    const result = await response.json();
                    apiState.initialized = result.result !== 'true';
                    apiState.lastError = result.errorCode;
                    
                    if (!apiState.initialized) {
                        updateStatus('Completed');
                    }
                    
                    logDebug('LMSFinish result', result);
                    return result.result;
                } catch (error) {
                    logDebug('LMSFinish error', error);
                    apiState.lastError = '101';
                    return 'false';
                }
            },

            // Get a value from the LMS
            LMSGetValue: async function(element) {
                logDebug('LMSGetValue called', { element });
                
                try {
                    const response = await fetch(`${SCORM_CONFIG.apiBaseUrl}/runtime/getvalue/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-SCORM-Session': SCORM_CONFIG.sessionId,
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ element })
                    });
                    
                    const result = await response.json();
                    apiState.lastError = result.errorCode;
                    
                    logDebug('LMSGetValue result', result);
                    return result.value || '';
                } catch (error) {
                    logDebug('LMSGetValue error', error);
                    apiState.lastError = '101';
                    return '';
                }
            },

            // Set a value in the LMS
            LMSSetValue: async function(element, value) {
                logDebug('LMSSetValue called', { element, value });
                
                // Cache the value locally
                apiState.dataCache[element] = value;
                
                try {
                    const response = await fetch(`${SCORM_CONFIG.apiBaseUrl}/runtime/setvalue/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-SCORM-Session': SCORM_CONFIG.sessionId,
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ element, value })
                    });
                    
                    const result = await response.json();
                    apiState.lastError = result.errorCode;
                    
                    logDebug('LMSSetValue result', result);
                    return result.result;
                } catch (error) {
                    logDebug('LMSSetValue error', error);
                    apiState.lastError = '101';
                    return 'false';
                }
            },

            // Commit data to the LMS
            LMSCommit: async function(parameter) {
                logDebug('LMSCommit called', { parameter });
                
                try {
                    const response = await fetch(`${SCORM_CONFIG.apiBaseUrl}/runtime/commit/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-SCORM-Session': SCORM_CONFIG.sessionId,
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ parameter })
                    });
                    
                    const result = await response.json();
                    apiState.lastError = result.errorCode;
                    
                    logDebug('LMSCommit result', result);
                    return result.result;
                } catch (error) {
                    logDebug('LMSCommit error', error);
                    apiState.lastError = '101';
                    return 'false';
                }
            },

            // Get last error code
            LMSGetLastError: function() {
                logDebug('LMSGetLastError called', { errorCode: apiState.lastError });
                return apiState.lastError;
            },

            // Get error string for an error code
            LMSGetErrorString: async function(errorCode) {
                logDebug('LMSGetErrorString called', { errorCode });
                
                const errorStrings = {
                    '0': 'No error',
                    '101': 'General exception',
                    '201': 'Invalid argument error',
                    '202': 'Element cannot have children',
                    '203': 'Element is not an array',
                    '301': 'Not initialized',
                    '302': 'Already initialized',
                    '401': 'API not implemented'
                };
                
                return errorStrings[errorCode] || 'Unknown error';
            },

            // Get diagnostic information for an error code
            LMSGetDiagnostic: async function(errorCode) {
                logDebug('LMSGetDiagnostic called', { errorCode });
                
                const diagnostics = {
                    '0': 'No error occurred.',
                    '101': 'A general error occurred during SCORM API processing.',
                    '201': 'An invalid argument was passed to the API method.',
                    '202': 'The element cannot have children in the data model.',
                    '203': 'The element is not an array and cannot be accessed as one.',
                    '301': 'The SCORM API has not been initialized. Call LMSInitialize first.',
                    '302': 'The SCORM API has already been initialized.',
                    '401': 'The requested API method is not implemented.'
                };
                
                return diagnostics[errorCode] || 'No diagnostic information available.';
            }
        };

        // Helper function to get CSRF cookie
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Expose SCORM API to the iframe content
        window.API = SCORM_API;

        // Also expose as API_1484_11 for SCORM 2004 compatibility (stub)
        window.API_1484_11 = {
            Initialize: function() { return 'false'; },
            Terminate: function() { return 'false'; },
            GetValue: function() { return ''; },
            SetValue: function() { return 'false'; },
            Commit: function() { return 'false'; },
            GetLastError: function() { return '0'; },
            GetErrorString: function() { return 'Not implemented'; },
            GetDiagnostic: function() { return 'Not implemented'; }
        };

        // Handle iframe load events
        document.getElementById('scorm-frame').addEventListener('load', function() {
            logDebug('SCORM content iframe loaded');
            updateStatus('Content Loaded');
            
            // Try to auto-initialize if content calls LMSInitialize
            setTimeout(() => {
                if (!apiState.initialized) {
                    logDebug('Auto-initializing SCORM API');
                    SCORM_API.LMSInitialize('');
                }
            }, 1000);
        });

        // Handle window unload
        window.addEventListener('beforeunload', function() {
            if (apiState.initialized) {
                logDebug('Window unloading, finishing SCORM session');
                // Synchronous call for unload
                navigator.sendBeacon(`${SCORM_CONFIG.apiBaseUrl}/runtime/finish/`, 
                    JSON.stringify({ parameter: '', session_id: SCORM_CONFIG.sessionId }));
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            logDebug('SCORM launch wrapper initialized', SCORM_CONFIG);
            updateStatus('Ready');
        });

        // Handle errors
        window.addEventListener('error', function(event) {
            logDebug('JavaScript error', { 
                message: event.message, 
                filename: event.filename, 
                lineno: event.lineno 
            });
        });
    </script>
</body>
</html>
